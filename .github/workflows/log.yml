name: '@idearium/log'
on:
    push:
        paths:
            - 'packages/log/**'

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  cache: npm
                  node-version: '24'
            - run: npm install
            - run: npm test --workspace=@idearium/log
